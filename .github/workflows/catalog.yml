name: Build Catalog Snapshot

# 剧集快照（0.8.19 建立，0.8.20 改定时增量）。
#
# 目的：别再让每台设备都自己去各站源抓目录。CI 定时抓一轮、加密后提交到
# `catalog` 分支，App 在「设置 → 站源管理 → 同步远程数据源」手动拉这份快照
# （走 jsDelivr），拿不到再退回现场抓取。
#
# 为什么改增量（0.8.20）：原来是每 2 小时整站翻 60 页，一天 12 轮，对站源
# 来说就是一台永不休息的爬虫，容易被风控盯上。现在拆成两条：
#
#   增量  每 6 小时（:20）  `-pages 3` + `--merge`，只翻前几页拿新剧，
#                          剩下的由上一轮快照按 id 补齐。**这是唯一的定时任务，
#                          也绝不做任何全量重抓**（见下）。
#   全量  只能手动触发      `-pages 2000` + 3 轮取并集 + **逐分类枚举**，整站重抓。
#                          既清理增量模式下会残留的下架剧，也是站点改版后重新
#                          对齐的兜底。分类枚举只在全量开：它能把黄剧从 2000
#                          补到 3105、河马从 652 补到 10908，但请求量会放大几十倍
#                          （黄剧 378 个分类），放进每 6 小时的增量等于自找风控。
#
# **自动补漏为什么被摘掉**（2026-11-10）：0.8.24 曾在增量跑完后用
# `fresh < old * 0.9` 找「数据偏少」的站源，单独对它们做一次
# `-pages 2400 -categories=true` 全量重抓。但 `fresh` 是增量 3 页的结果
# （每源 30~300 条），`old` 是 index 里上一版的**全量**（几千到几万条），
# 这个条件对任何能抓到的站源都恒真 —— 实测连续多轮固定命中 10~11 个源，
# 每 6 小时整站重抓一遍、单轮 25~35 分钟，等于把「全量不进 cron」从后门
# 放了回来，比原来每天一次还密 4 倍。更讽刺的是真正残缺的源（花果 / 网果 /
# 伍果 / 囧次元在境外 runner 恒 403）本轮根本不产出 dump，压根进不了只遍历
# `dump.glob('*.json')` 的补漏名单，一次也补不到；补抓偶尔还整站抓空，
# 空文件反过来替换掉本来正常的增量 dump。
#
# 增量本来就不会让快照缩水：`--merge` 按 id 把上一轮全量补齐，
# `previous_entries()` 沿用本轮没产出的站源，截断 dump 也不许覆盖更全的旧数据。
# 历史残血只能靠人工在国内机器深抓后手工提交（境外重抓多少次都是 403）。
# 要补某个站源，手动 dispatch `mode=full` + `sources=<id>`：
# 那条路带 3 轮并集，比原来补漏的单轮更可靠，且请求量由人控制。
#
# **全量不再进 cron**（2026-11-02 用户要求）：14 个站源整站翻到底一天一轮，
# 请求量和规律性都太显眼，容易触发对端风控。需要时在 Actions 页面手动跑
# `workflow_dispatch` 并选 `mode=full`，跑完那一次就够。
#
# **全量的页数必须给足**：`-pages 60` 会把红果截成 2868 部（真实 3900 部以上），
# 更夸张的是网果 / 无果 —— 它们各有 3.8 万部，`-pages 60` 只拿到 1440 部。
# 而截断以前是完全静默的 —— 用户那边本机反而比远端多。现在 catalogdump 撞到
# 上限会打 `[warn] ... 快照不完整`（只在全量模式转成 Actions 注解），看到就该调大。
#
# **单轮还不够，必须多轮取并集**（2026-11-02 实测）：红果的 App 分类接口每次
# 返回的切片都不一样 —— 同一天四轮分别拿到 1331 / 2803 / 3217 / 3595 条，
# 两两交集只有 1200~2100，每轮都"看起来翻到底了"。并集是收敛的（2803 →
# 3903 → 3928），所以全量模式跑 3 轮，没有新增就提前收工。
# 合并逻辑见 `scripts/merge_catalog_dumps.py`。
#
# 两种模式都保证「内容不变则产物逐字节不变」，没变化时下面的 `git diff` 直接跳过提交。
#
# 分支结构（由 scripts/build_catalog_snapshot.py 生成）：
#   index.json                明文索引：版本 / 生成时间 / 每个站源的文件与 sha256
#   sources/<站源>.json.enc   [12 字节 nonce][AES-256-GCM 密文]
#
# 注意：密钥随 APK 分发，加密只是"别让人随手把目录拖走"，不是安全边界。

on:
  schedule:
    # 只保留增量：每 6 小时的第 20 分钟（UTC）。
    # 全量**故意不放进 cron** —— 整站翻到底太像爬虫，会触发对端风控，
    # 需要时手动 workflow_dispatch 选 mode=full。
    - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental=只翻前几页并与上一轮合并；full=整站重抓（慢，慎用）'
        type: choice
        options:
          - incremental
          - full
        default: incremental
      pages:
        description: '每个站源最多翻多少页（留空按模式取默认：增量 3 / 全量 2000）'
        type: string
        default: ''
      passes:
        description: '每个站源跑几轮取并集（留空按模式取默认：增量 1 / 全量 3）'
        type: string
        default: ''
      sources:
        description: '只导出这些站源（逗号分隔，留空表示全部；配合 mode=full 单源重抓补漏）'
        type: string
        default: ''

permissions:
  contents: write

env:
  GO_VERSION: '1.24.1'

# 同一时间只跑一个：避免两次运行互相覆盖 catalog 分支。
concurrency:
  group: catalog-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 全量要整站翻到底：红果 3595 部约 4 分钟，青空 4700 部更久，15 个站源
    # 串行跑下来 20 分钟起步，45 分钟不够用。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Restore catalog branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/catalog-out
          if git ls-remote --exit-code --heads origin catalog >/dev/null 2>&1; then
            git fetch --depth=1 origin catalog
            git archive FETCH_HEAD | tar -x -C /tmp/catalog-out
            echo "已还原上一轮快照：$(ls /tmp/catalog-out/sources 2>/dev/null | wc -l) 个站源"
          else
            echo "catalog 分支还不存在，本次是首轮"
          fi

      - name: Resolve mode
        shell: bash
        run: |
          set -euo pipefail
          # 定时触发只有增量一条 cron，inputs 为空时一律按增量走；
          # 全量只能从 workflow_dispatch 的 mode=full 进来。
          mode='${{ inputs.mode }}'
          if [ -z "$mode" ]; then
            mode=incremental
          fi
          pages='${{ inputs.pages }}'
          if [ -z "$pages" ]; then
            if [ "$mode" = full ]; then pages=2000; else pages=3; fi
          fi
          passes='${{ inputs.passes }}'
          if [ -z "$passes" ]; then
            if [ "$mode" = full ]; then passes=3; else passes=1; fi
          fi
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "PAGES=$pages" >> "$GITHUB_ENV"
          echo "PASSES=$passes" >> "$GITHUB_ENV"
          # 0.8.24：**只有全量才逐分类枚举**。
          #
          # 分类枚举是全量补全的关键（黄剧 2000→3105、河马 652→10908、
          # 黄豆 3004→4524），但它会把请求量放大几十倍：黄剧 378 个分类、
          # 河马 125 个、黄豆 3 个排序。增量模式每 6 小时跑一次、只翻 3 页，
          # 目的是"捡最新几部剧"（新剧都在主排序前几页），逐分类枚举既拿不到
          # 新东西，又会让每轮从 42 个请求涨到 2000+，等于自找风控。
          if [ "$mode" = full ]; then categories=true; else categories=false; fi
          echo "CATEGORIES=$categories" >> "$GITHUB_ENV"
          echo "本轮模式：$mode，每个站源最多 $pages 页，跑 $passes 轮取并集，分类枚举=$categories"

      - name: Dump catalogs
        working-directory: native
        shell: bash
        run: |
          # 单个站源抓不到不该让整轮失败：境外 runner 访问国内站源偶发不通。
          set -uo pipefail
          go build -ldflags "-X duanjuapp/native/core.buildAllSources=true" -o /tmp/catalogdump ./cmd/catalogdump
          mkdir -p /tmp/catalog-passes
          previous_total=-1
          for pass in $(seq 1 "$PASSES"); do
            echo "::group::第 $pass / $PASSES 轮"
            out="/tmp/catalog-passes/pass-$pass"
            log="/tmp/catalogdump-$pass.log"
            mkdir -p "$out"
            # 每轮换一个工作目录：原生侧 `initialize` 只在 engine 为空时生效，
            # 同一进程里换目录不会重置红果的分页游标。用新目录 = 新会话，
            # 才能拿到一个不同的切片。
            /tmp/catalogdump \
              -dir "/tmp/catalog-work-$pass" \
              -out "$out" \
              -pages "$PAGES" \
              -categories="$CATEGORIES" \
              -sources '${{ inputs.sources || '' }}' 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            # 撞到翻页上限的站源在日志里是 [warn] 行，转成 Actions 注解，
            # 否则"快照被静默截断"又要靠人翻日志才发现（0.8.20 的教训）。
            # **只有全量模式才转**：增量本来就只翻 3 页，每个站源都会"截断"，
            # 每 6 小时亮 12 条注解等于教人忽略这个告警。
            if [ "$MODE" = full ]; then
              while IFS= read -r line; do
                echo "::warning::${line#\[warn\] }"
              done < <(grep '^\[warn\]' "$log" || true)
            fi
            echo "dump 退出码 $status（有站源失败是允许的）"
            # 多轮取并集：红果的 App 分类接口每轮返回的切片都不一样
            # （实测 1331 / 2803 / 3217 / 3595，两两交集才一千多），
            # 任何单轮都不能当全站目录。
            python3 ../scripts/merge_catalog_dumps.py --input /tmp/catalog-passes --output /tmp/catalog-dump
            total=$(python3 -c "import json,pathlib;print(sum(len(json.loads(p.read_text(encoding='utf-8')).get('items') or []) for p in pathlib.Path('/tmp/catalog-dump').glob('*.json')))")
            echo "第 $pass 轮并集后合计 $total 条"
            echo "::endgroup::"
            if [ "$pass" -gt 1 ] && [ "$total" = "$previous_total" ]; then
              echo "第 $pass 轮没有任何新增，并集已收敛，提前收工"
              break
            fi
            previous_total=$total
          done

      # 0.8.24 曾在这里放「Auto-heal short sources」：拿增量 3 页的条数和
      # 上一版全量比，偏少就对那几个源做 `-pages 2400 -categories=true`
      # 全量重抓。2026-11-10 摘掉 —— 比较口径不同，条件恒真，等于每 6 小时
      # 自动全量抓一次，而真正残缺的 403 源一次也补不到。详见文件头。
      # **这里不要再放任何自动补漏步骤**：单源重抓请手动 dispatch
      # `mode=full` + `sources=<id>`，让请求量由人决定。
      - name: Encrypt and index
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --quiet cryptography
          extra=''
          if [ "$MODE" = incremental ]; then
            extra='--merge'
          fi
          python3 scripts/build_catalog_snapshot.py \
            --input /tmp/catalog-dump --output /tmp/catalog-out $extra
          if [ ! -s /tmp/catalog-out/index.json ]; then
            echo "::warning::这一轮没有产出任何站源快照，跳过提交"
            exit 0
          fi
          python3 - <<'PY'
          import json, pathlib
          index = json.loads(pathlib.Path('/tmp/catalog-out/index.json').read_text(encoding='utf-8'))
          sources = index.get('sources') or {}
          print(f"index.json：{len(sources)} 个站源，生成时间 {index.get('generatedAt')}")
          for name, entry in sorted(sources.items()):
              print(f"  - {name}: {entry.get('count')} 条")
          if not sources:
              raise SystemExit(1)
          PY

      - name: Publish to catalog branch
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/catalog-out
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b catalog
          git add -A
          if git diff --cached --quiet; then
            echo "快照内容没有变化，跳过提交"
            exit 0
          fi
          git commit -q -m "chore(catalog): 更新剧集快照 $MODE $(date -u +%Y-%m-%dT%H:%MZ)"
          # 强制推送单个提交：快照一天要变好几次，保留历史只会让仓库无限膨胀。
          # jsDelivr 按分支名取最新，不影响 CDN。
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalog
