name: E站 Live Smoke Test

on:
  # 只留手动触发：原来还挂着一个 `push: branches: [feat/ezdmw-anime-source]`，
  # 那条特性分支 0.8.16 之后已经删掉，触发条件成了死配置。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ezdmw-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - name: Live catalog, detail, and playback probe
        working-directory: native
        env:
          EZDMW_LIVE_TEST: '1'
        # 0.8.9：连"标题带空格"的番剧一起跑。之前只测无空格标题，
        # 正好绕过 iframe 地址未转义的坑，测试全绿但线上播不了。
        run: go test ./core -run '^TestEZDMWLive' -count=1 -v
