name: Dump CI Keystore

# 临时工作流（0.8.18 签名止血用）：把 Actions 缓存里的 ci-debug.keystore 取出来，
# 转存到仓库 Secret。用完即删 —— 不要让它长期留在仓库里。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore CI debug keystore
        uses: actions/cache@v4
        with:
          path: android/app/ci-debug.keystore
          key: android-ci-debug-keystore-v1

      - name: Report certificate
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/ci-debug.keystore || { echo "缓存里没有 keystore"; exit 1; }
          ls -l android/app/ci-debug.keystore
          keytool -list -v -keystore android/app/ci-debug.keystore -storepass android \
            | grep -E "Alias name|Owner|Valid|SHA256:"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: ci-keystore
          path: android/app/ci-debug.keystore
          retention-days: 1
          if-no-files-found: error
