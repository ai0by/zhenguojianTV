name: Build APK

on:
  workflow_dispatch:
    inputs:
      all_sources:
        description: '构建真果鉴（全部站源）；关闭则只构建红果鉴'
        type: boolean
        default: true
      tv:
        description: '电视版 ABI（arm64-v8a + armeabi-v7a）'
        type: boolean
        default: true
      universal:
        description: '额外产出通用 APK'
        type: boolean
        default: true
      publish_release:
        description: '构建完成后发布到 GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: '发布使用的标签（留空则用当前 ref）'
        type: string
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.24.1'
  NDK_VERSION: '28.2.13676358'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android NDK ${{ env.NDK_VERSION }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.NDK_VERSION }}'

      - name: Export NDK path
        shell: bash
        run: |
          set -euxo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ndk="$sdk/ndk/$NDK_VERSION"
          test -d "$ndk"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"

      # 0.8.10 第三批：固定 CI 签名。
      #
      # 没配 key.properties 时 AGP 用 `~/.android/debug.keystore`，而它在每台
      # runner 上都是新生成的随机密钥 —— 每次构建签名都不同，用户装新包时
      # 安装器判签名冲突（部分 ROM 报的正是"解析软件包失败"），升级必须先卸载。
      #
      # 0.8.18：**改成从仓库 Secret 还原**。原来用 `actions/cache` 存这把密钥，
      # 但缓存会在 7 天未访问 / 仓库总量超 10GB 时被清掉，然后下面的
      # `keytool -genkeypair` 就现造一把新的 —— 实测 0.8.5 / 0.8.7 / 0.8.9 /
      # 0.8.10~0.8.17 已经是**四把不同的证书**，跨这几版覆盖安装必然失败。
      #
      # 所以这里只做两件事：从 `secrets.CI_KEYSTORE_BASE64` 解出 p12；缺失就
      # **直接构建失败**。绝不能再 fallback 到现生成 —— 静默换钥匙比构建失败
      # 可怕得多，用户只会看到"下载完装不上"。
      - name: Restore CI debug keystore
        shell: bash
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CI_KEYSTORE_BASE64:-}" ]; then
            echo "缺少仓库 Secret CI_KEYSTORE_BASE64（base64 编码的 ci-debug.keystore）。" >&2
            echo "签名一旦变化，已装用户将无法覆盖安装，因此这里直接失败而不是现生成一把新密钥。" >&2
            exit 1
          fi
          printf '%s' "$CI_KEYSTORE_BASE64" | base64 -d > android/app/ci-debug.keystore
          keytool -list -keystore android/app/ci-debug.keystore -storepass android | grep -i "androiddebugkey"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          args=()
          if [ '${{ inputs.all_sources }}' = 'true' ]; then args+=(--all-sources); fi
          if [ '${{ inputs.tv }}' = 'true' ]; then args+=(--tv); fi
          if [ '${{ inputs.universal }}' = 'true' ]; then args+=(--universal); fi
          python3 scripts/build_android.py "${args[@]}"

      # 0.8.10 第三批：出包后必须用**官方工具**验一遍，不能只看"文件生成了"。
      # 用户反馈 all 包装到手机上提示"解析软件包失败"，而打包脚本原来只检查
      # zip 里有没有那几个 .so —— 签名坏了、对齐坏了都发现不了。这里补上：
      #   apksigner verify  验签名（含 v2/v3，签名坏了就是这个报错）
      #   zipalign -c 4     验对齐（未对齐的包部分安装器也会拒绝）
      #   aapt2 dump badging 打印 minSdk / ABI，便于事后对照用户设备
      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)"
          echo "build-tools: $build_tools"
          for apk in dist/android/*.apk; do
            echo "=== $apk"
            "$build_tools/apksigner" verify --verbose "$apk" | tee verify.txt
            # v2 是 Android 7+ 的主签名，必须为 true（签名坏了安装器就报解析失败）。
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
            # v1 只做提示：minSdk 24 起 AGP 默认不出 v1，这里已经显式打开，
            # 但不同 AGP 版本对 debug 签名的处理不完全一致，不作为失败条件。
            grep -E "Verified using v1 scheme" verify.txt || true
            "$build_tools/zipalign" -c 4 "$apk"
            "$build_tools/aapt2" dump badging "$apk" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code"
          done

      # 0.8.18：签名证书指纹硬断言。
      #
      # `Verify APK` 只能证明"签名没坏"，证明不了"签名还是那把钥匙"。历史上
      # 已经因为缓存被清换过四次密钥，每次换完用户都得卸载重装。这里把期望
      # 指纹写死（= 0.8.10 起线上所有安装包的那把），对不上就让构建失败，
      # 免得又悄悄发出一批装不上的包。
      #
      # 真要换密钥时，必须同时改这里，并且清楚这意味着老用户只能卸载重装。
      - name: Assert signing certificate
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)"
          expected="4c467845d641eca462515baccce10c55b4b624c50e8c55d15f9f225107065231"
          for apk in dist/android/*.apk; do
            actual=$("$build_tools/apksigner" verify --print-certs "$apk" \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr -d ' :' | tr 'A-Z' 'a-z')
            echo "$apk -> $actual"
            if [ "$actual" != "$expected" ]; then
              echo "签名证书指纹不符（期望 $expected，实际 $actual）。" >&2
              echo "已装用户将无法覆盖安装，构建终止。" >&2
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: |
            dist/android/*.apk
            dist/android/*.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: android
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            pubspec.yaml
          sparse-checkout-cone-mode: false

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: artifacts

      - name: List artifacts
        shell: bash
        run: |
          set -euxo pipefail
          find artifacts -type f | sort
          test -n "$(find artifacts -name '*.apk' -type f)"

      # 发布说明原来是在下面硬编码的 0.8.7 文案，之后每版都忘了改，
      # 于是每个 Release 都写着 0.8.7。现在从 CHANGELOG.md 里抓当前版本的
      # `### <版本> · <主题>` 小节。版本号取自 pubspec.yaml，两处自动对齐。
      # （0.8.10：更新说明从 README 抽到 CHANGELOG.md，README 只留产品介绍。）
      #
      # 0.8.17：原来只抓标题里的主题文字，Release 正文就一行
      # `- 画中画 + 河马站源`，点进去看不到任何细节（0.8.17 的正文是事后
      # 用 API 补的）。现在把整节正文（标题 + 所有条目）搬过来，标题降一级
      # `### x · y` → `## x · y`，遇到下一个 `### ` 或分隔线 `---` 收尾。
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "pubspec.yaml 里没读到版本号" >&2
            exit 1
          fi
          notes=$(LC_ALL=C awk -v v="$version" '
            /^### / {
              if (index($0, "### " v " · ") == 1) {
                grab = 1
                print "## " substr($0, 5)
                next
              } else if (grab) {
                exit
              }
            }
            grab {
              if ($0 ~ /^---[[:space:]]*$/) exit
              print
            }
          ' CHANGELOG.md | sed -e 's/[[:space:]]*$//' | cat -s)
          {
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes"
            else
              echo "## $version"
              echo
              echo "本版构建产物见下方附件，详细说明见 CHANGELOG.md。"
            fi
            echo
            echo "**产物**：\`all\` / \`arm64-v8a\` / \`armeabi-v7a\`"
            echo
            echo "**构建环境**：Flutter 3.47.4 / Go 1.24.1 / NDK 28.2.13676358"
            echo
            echo "详细说明见 [CHANGELOG](https://github.com/ai0by/zhenguojianTV/blob/main/CHANGELOG.md)。"
          } > release_body.md
          echo "--- release_body.md ---"
          cat release_body.md
          # Release 标题要带产品名（0.8.16）：原来直接用 tag 名，列表里只剩
          # `v0.8.16` 这种光秃秃的版本号，看不出是哪个应用。版本号取自
          # pubspec.yaml，跟 APK 里的一致；tag 带不带 `v` 都不影响。
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # 附件前缀统一成 `zhenguojianTV`（0.8.16）。
      #
      # 产物本来由 `scripts/package_release.py` 按 `variant.slug` 命名，即
      # `zhenguojian-<版本+build>-<abi>.apk`。这里只把前缀换成品牌全名，
      # 版本号和 ABI 原样保留 —— **别重新拼整段文件名**：slug 拼出来的
      # 已经是完整名字，再拼一层就成了
      # `zhenguojianTV-0.8.16+95-zhenguojian-0.8.16+95-all.apk.apk`。
      #
      # `hongguojian-` 是只含红果的独立分发线，品牌不动，不在这里改。
      - name: Rename APK for release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for apk in artifacts/**/*.apk; do
            base=$(basename "$apk")
            renamed=$(printf '%s' "$base" | sed 's/^zhenguojian-/zhenguojianTV-/')
            [ "$renamed" = "$base" ] && continue
            mv "$apk" "$(dirname "$apk")/$renamed"
            echo "renamed: $base -> $renamed"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          # 标题固定 `zhenguojianTV v<版本>`：品牌在前，版本在后。
          name: zhenguojianTV v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: artifacts/**/*.apk
          body_path: release_body.md
