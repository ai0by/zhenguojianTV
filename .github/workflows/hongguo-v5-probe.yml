name: 红果取流海外出口验证（临时）

# 一次性诊断 workflow：本机出口取流接口全部 200+0，无法区分
# 「本机出口 IP 被风控」与「v5 签名移植有细节错误」。借 GitHub runner 的
# 海外出口跑同一套逻辑：v4 生产链路（对照）+ v5 新签名（关键判定）。
# 定论后删除本 workflow 与两个临时探针，不入库。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hongguo-v5-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: 出口 IP 与 DNS
        run: |
          echo "=== runner 出口 IP ==="
          curl -sS -m 15 https://api.ipify.org || true
          echo
          echo "=== 取流域名解析 ==="
          getent ahostsv4 api5-normal-sinfonlinea.fqnovel.com | head -3 || true
          getent ahostsv4 api5-normal-sinfonlineb.fqnovel.com | head -3 || true

      - name: v4 生产链路（对照）
        working-directory: native
        env:
          ZGJ_VERIFY_PROBE: '1'
        run: go test ./core -run '^TestZgjVerifyProductionPlayback$' -count=1 -v -timeout 10m

      - name: v5 新签名取流（关键判定）
        working-directory: native
        env:
          HG_V5_PROBE: '1'
        run: go test ./core -run '^TestHongguoV5PlaybackProbe$' -count=1 -v -timeout 10m
