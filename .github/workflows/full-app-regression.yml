name: Full App Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - name: Diagnose Xiangjiao live API (temporary)
        continue-on-error: true
        shell: bash
        run: |
          set -u
          for base in https://xiangjiaoai.ai https://xiangjiao01.com; do
            echo "=== $base/api/home/hot ==="
            curl --silent --show-error --location --max-time 15 \
              -H 'Accept: application/json' \
              -H 'User-Agent: Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/125.0.0.0 Mobile Safari/537.36' \
              -H "Origin: $base" -H "Referer: $base/" \
              -D /tmp/xiangjiao-headers -o /tmp/xiangjiao-body \
              -w 'HTTP %{http_code}\n' "$base/api/home/hot" || true
            sed -n '1,16p' /tmp/xiangjiao-headers || true
            head -c 1800 /tmp/xiangjiao-body || true
            printf '\n'
          done

      - name: Deterministic native regression
        working-directory: native
        shell: bash
        run: |
          set -euxo pipefail
          go test ./core -run 'Test(ParseProviderMirrorDocument|InvalidProviderMirrorDocumentFallsBack|ProviderMirrorConfigUsesJsDelivr|ValidProviderMirrorOriginRejectsUnsafeAddresses|ProviderBaseCandidatesPrefersRememberedThenRemoteThenBuiltin|ProviderURLCandidatesDynamicPreservesPathAndQuery|XiangjiaoJSONRetriesForbiddenPrimaryMirror|XiangjiaoFullPlaybackProbeUsesConcurrency|XiangjiaoFullPlaybackRejectsLockedEpisodes)$' -count=1
          go test ./bridge -run '^$'

  shared-apk-flutter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Shared APK Flutter regression (phone + TV, all sources)
        run: flutter test --dart-define=ALL_SOURCES=true --concurrency=1
