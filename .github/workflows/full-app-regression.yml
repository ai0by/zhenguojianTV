name: Full App Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - name: Deterministic native regression
        working-directory: native
        shell: bash
        run: |
          set -euxo pipefail
          go test ./core -run 'Test(ParseProviderMirrorDocument|InvalidProviderMirrorDocumentFallsBack|ProviderMirrorConfigUsesJsDelivr|ValidProviderMirrorOriginRejectsUnsafeAddresses|ProviderBaseCandidatesPrefersRememberedThenRemoteThenBuiltin|ProviderURLCandidatesDynamicPreservesPathAndQuery|XiangjiaoJSONRetriesForbiddenPrimaryMirror|XiangjiaoCatalogKeepsCoinLockedDramasVisible|XiangjiaoDetailMarksCoinEpisodesLocked|XiangjiaoPlayback403IsTreatedAsPaymentDenial)$' -count=1
          go test ./bridge -run '^$'

  shared-apk-flutter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Shared APK Flutter regression (phone + TV, all sources)
        run: flutter test --dart-define=ALL_SOURCES=true --concurrency=1
