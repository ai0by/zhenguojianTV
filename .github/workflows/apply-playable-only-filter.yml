name: Apply playable-only source filter

on:
  push:
    branches:
      - feature/yeguo-xiangjiao-sources
    paths:
      - .github/workflows/apply-playable-only-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yeguo-xiangjiao-sources
          fetch-depth: 0
      - name: Apply filter
        shell: python
        run: |
          from pathlib import Path

          p = Path('native/core/provider_xiangjiao.go')
          s = p.read_text()
          s = s.replace('"strconv"\n\t"strings"\n\t"time"', '"strconv"\n\t"strings"\n\t"sync"\n\t"time"')

          old_catalog = '''func (d *Downloader) fetchXiangjiaoCatalogPage(ctx context.Context, page int, query string) ([]Drama, bool, error) {
          \tif page > 1 {
          \t\treturn nil, false, nil
          \t}
          \tdecoded, err := d.xiangjiaoJSON(ctx, http.MethodGet, "/api/home/hot", nil, "")
          \tif err != nil {
          \t\treturn nil, false, err
          \t}
          \titems := xiangjiaoDramas(decoded)
          \tquery = strings.ToLower(strings.TrimSpace(query))
          \tif query != "" {
          \t\tfiltered := items[:0]
          \t\tfor _, drama := range items {
          \t\t\tif strings.Contains(strings.ToLower(drama.DisplayTitle()+" "+drama.Desc), query) {
          \t\t\t\tfiltered = append(filtered, drama)
          \t\t\t}
          \t\t}
          \t\titems = filtered
          \t}
          \treturn items, false, nil
          }'''.replace('          ', '')

          new_catalog = '''func (d *Downloader) fetchXiangjiaoCatalogPage(ctx context.Context, page int, query string) ([]Drama, bool, error) {
          \tif page > 1 {
          \t\treturn nil, false, nil
          \t}
          \tdecoded, err := d.xiangjiaoJSON(ctx, http.MethodGet, "/api/home/hot", nil, "")
          \tif err != nil {
          \t\treturn nil, false, err
          \t}
          \titems := xiangjiaoDramas(decoded)
          \tquery = strings.ToLower(strings.TrimSpace(query))
          \tif query != "" {
          \t\tfiltered := items[:0]
          \t\tfor _, drama := range items {
          \t\t\tif strings.Contains(strings.ToLower(drama.DisplayTitle()+" "+drama.Desc), query) {
          \t\t\t\tfiltered = append(filtered, drama)
          \t\t\t}
          \t\t}
          \t\titems = filtered
          \t}
          \treturn d.filterXiangjiaoFullyPlayable(ctx, items), false, nil
          }'''.replace('          ', '')
          if old_catalog not in s:
              raise SystemExit('catalog block not found')
          s = s.replace(old_catalog, new_catalog)

          marker = '''func xiangjiaoEpisodeMarker(episodeID string) string {'''
          helper = r'''type xiangjiaoPlayableCacheEntry struct {
          	playable bool
          	expires  time.Time
          }

          var xiangjiaoPlayableCache sync.Map

          func (d *Downloader) xiangjiaoDramaFullyPlayable(ctx context.Context, sourceID string) bool {
          	sourceID = strings.TrimSpace(sourceID)
          	if sourceID == "" {
          		return false
          	}
          	if cached, ok := xiangjiaoPlayableCache.Load(sourceID); ok {
          		entry := cached.(xiangjiaoPlayableCacheEntry)
          		if time.Now().Before(entry.expires) {
          			return entry.playable
          		}
          		xiangjiaoPlayableCache.Delete(sourceID)
          	}

          	raw, err := d.xiangjiaoJSON(ctx, http.MethodGet, "/api/dramas/"+url.PathEscape(sourceID)+"/episodes", nil, "")
          	if err != nil {
          		return false
          	}
          	seen := map[string]bool{}
          	count := 0
          	playable := true
          	walkXiangjiaoMaps(xiangjiaoPayloadData(raw), func(row map[string]any) {
          		id := xiangjiaoText(row, "id", "episode_id", "episodeId")
          		if id == "" || seen[id] {
          			return
          		}
          		index := xiangjiaoInt(row, "episode_number", "episodeNumber")
          		if index <= 0 && xiangjiaoText(row, "drama_id", "dramaId") == "" {
          			return
          		}
          		seen[id] = true
          		count++
          		if xiangjiaoEpisodeLocked(row) {
          			playable = false
          		}
          	})
          	playable = playable && count > 0
          	xiangjiaoPlayableCache.Store(sourceID, xiangjiaoPlayableCacheEntry{
          		playable: playable,
          		expires:  time.Now().Add(20 * time.Minute),
          	})
          	return playable
          }

          func (d *Downloader) filterXiangjiaoFullyPlayable(ctx context.Context, items []Drama) []Drama {
          	if len(items) == 0 {
          		return items
          	}
          	allowed := make([]bool, len(items))
          	sem := make(chan struct{}, 6)
          	var wg sync.WaitGroup
          	for i := range items {
          		if items[i].VIP != nil && *items[i].VIP {
          			continue
          		}
          		wg.Add(1)
          		go func(index int) {
          			defer wg.Done()
          			select {
          			case sem <- struct{}{}:
          				defer func() { <-sem }()
          			case <-ctx.Done():
          				return
          			}
          			probeCtx, cancel := context.WithTimeout(ctx, 5*time.Second)
          			defer cancel()
          			allowed[index] = d.xiangjiaoDramaFullyPlayable(probeCtx, items[index].SourceID)
          		}(i)
          	}
          	wg.Wait()

          	filtered := make([]Drama, 0, len(items))
          	for i, drama := range items {
          		if allowed[i] {
          			vip := false
          			drama.VIP = &vip
          			filtered = append(filtered, drama)
          		}
          	}
          	return filtered
          }

          '''.replace('          ', '')
          if marker not in s:
              raise SystemExit('episode marker not found')
          s = s.replace(marker, helper + marker, 1)

          old_len = '''\tif len(episodes) == 0 {
          \t\treturn Drama{}, nil, fmt.Errorf("香蕉详情未返回分集")
          \t}
          \tfor index := range episodes {'''.replace('          ', '')
          new_len = '''\tif len(episodes) == 0 {
          \t\treturn Drama{}, nil, fmt.Errorf("香蕉详情未返回分集")
          \t}
          \tfor _, episode := range episodes {
          \t\tif episode.locked {
          \t\t\treturn Drama{}, nil, fmt.Errorf("香蕉该剧存在受限分集，已按完整可播放策略隐藏")
          \t\t}
          \t}
          \tfor index := range episodes {'''.replace('          ', '')
          if old_len not in s:
              raise SystemExit('detail episode block not found')
          s = s.replace(old_len, new_len, 1)
          p.write_text(s)

          m = Path('lib/models.dart')
          t = m.read_text()
          t = t.replace(" || id == 'yeguo'", "")
          t = t.replace("    SourceSite('yeguo', '野果短剧', '推荐 · 搜索 · 完整分集'),\n", "")
          m.write_text(t)
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w native/core/provider_xiangjiao.go
          git diff --check
          git diff -- native/core/provider_xiangjiao.go lib/models.dart
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/core/provider_xiangjiao.go lib/models.dart
          git commit -m 'feat: show only fully playable Xiangjiao dramas'
          git push origin HEAD:feature/yeguo-xiangjiao-sources
