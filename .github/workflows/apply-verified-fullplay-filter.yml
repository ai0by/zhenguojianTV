			for _, child := range typed {
				walk(child)
			}
		case []any:
			for _, child := range typed {
				walk(child)
			}
		}
	}
	walk(value)
	return ids
}

func yeguoPlaybackMap(value any) map[string]any {
	if row, ok := value.(map[string]any); ok {
		if yeguoText(row, "video_url", "video_url_h265", "play_url", "manifest_url", "url") != "" {
