name: Build Windows

# Windows 端只在这里构建：本地不装 Flutter / VS，全部交给 GitHub 托管的
# windows-latest（预装 VS2022 Enterprise + CMake + MSVC C++ 工作负载）。
# 与 Build APK 一样只挂 workflow_dispatch，push 不触发，免得每次提交都跑
# 一轮 20 分钟的 Windows 构建。
on:
  workflow_dispatch:
    inputs:
      all_sources:
        description: '构建真果鉴（全部站源）；关闭则只构建红果鉴'
        type: boolean
        default: true
      smoke:
        description: '出包后跑 --package-smoke 启动验收'
        type: boolean
        default: true
      publish_release:
        description: '把 zip 发到可直接下载的预发布 Release'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.24.1'
  # 境外 runner 直连官方源比绕国内镜像稳；build_windows.py 用的是
  # setdefault，这里先给值就不会再被改成 goproxy.cn。
  GOPROXY: 'https://proxy.golang.org,direct'
  GOSUMDB: 'sum.golang.org'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Go 的 -buildmode=c-shared 在 Windows 上必须走 cgo，而 cgo 只认 gcc，
      # MSVC 的 cl.exe 不行。windows-latest 预装了 MSYS2 但**没加 PATH**，
      # 也不保证带 mingw-w64 工具链，所以这里显式装一份并暴露给后续步骤。
      - name: MinGW-w64 for Go c-shared DLL
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # ffmpeg 只是给 --package-smoke 造 3 秒测试片用的，不是产品依赖。
          # 它和 gcc 一起落在 mingw64/bin，下面的 Expose 步骤已经把该目录
          # 加进 GITHUB_PATH，smoke 里就能直接调 ffmpeg.exe。
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ffmpeg

      - name: Expose MinGW-w64 compiler
        shell: pwsh
        run: |
          # setup-msys2 的 location 是「安装父目录」，不同 runner 镜像可能把
          # MSYS2 放在 C:\msys64，也可能在 RUNNER_TEMP 下新解一套，所以别硬编码，
          # 直接把实际装好的交叉编译器找出来。
          $roots = @('C:\msys64', (Join-Path $env:RUNNER_TEMP 'msys64'),
                     'D:\a\_temp\msys64', 'C:\Program Files\msys64')
          $found = @()
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              $found += @(Get-ChildItem -LiteralPath $root -Filter 'x86_64-w64-mingw32-gcc.exe' -Recurse -File -ErrorAction SilentlyContinue)
            }
          }
          Write-Host "找到 $($found.Count) 个 x86_64-w64-mingw32-gcc.exe:"
          $found | ForEach-Object { Write-Host "  $($_.FullName)" }
          if (-not $found) { throw 'setup-msys2 装完仍找不到 MinGW-w64 交叉编译器' }
          $preferred = @($found | Where-Object { $_.FullName -match '\\mingw64\\' })
          $cc = if ($preferred.Count -gt 0) { $preferred[0] } else { $found[0] }
          $bin = Split-Path $cc.FullName -Parent
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "CC=$($cc.FullName)"
          & $cc.FullName --version | Select-Object -First 1

      - name: Toolchain sanity
        shell: pwsh
        run: |
          foreach ($tool in @('flutter', 'dart', 'go', 'python', 'cmake', 'x86_64-w64-mingw32-gcc', 'ffmpeg')) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($found) { Write-Host ("{0} -> {1}" -f $tool, $found.Source) }
            else { Write-Host "WARN: $tool 不在 PATH（不一定致命，Flutter 会自己找 VS/CMake）" }
          }
          flutter --version
          go version

      - name: Build Windows bundle
        shell: pwsh
        run: |
          $buildArgs = @()
          if ('${{ inputs.all_sources }}' -eq 'true') { $buildArgs += '--all-sources' }
          python scripts/build_windows.py @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "build_windows.py 退出码 $LASTEXITCODE" }

      - name: List bundle contents
        if: always()
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          if (Test-Path $bundle) { Get-ChildItem $bundle | Select-Object Name, Length }
          if (Test-Path 'dist/windows') { Get-ChildItem 'dist/windows' | Select-Object Name, Length }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.all_sources && 'zhenguojian' || 'hongguojian' }}-windows-x64
          path: |
            dist/windows/*.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # 启动验收放在上传之后：即使 runner 环境导致 smoke 失败，安装包本身
      # 也已经进了 Actions 产物。但**不能把失败显示成 OK** —— 原来只挂
      # continue-on-error，job 上一片绿，实际是 FileNotFoundError 没跑起来。
      # 现在用 outcome 单独出结论，真失败就打 warning 并写进 job summary。
      - name: Package smoke test
        id: smoke
        if: ${{ inputs.smoke }}
        continue-on-error: true
        shell: pwsh
        run: |
          $smokeArgs = @()
          if ('${{ inputs.all_sources }}' -eq 'true') { $smokeArgs += '--all-sources' }
          python scripts/smoke_windows.py @smokeArgs
          if (Test-Path 'build/windows-package-smoke.json') {
            Get-Content 'build/windows-package-smoke.json'
          }

      - name: Smoke verdict
        if: ${{ always() && inputs.smoke }}
        shell: pwsh
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          $report = 'build/windows-package-smoke.json'
          if ($env:SMOKE_OUTCOME -eq 'success') {
            Write-Host '启动验收通过'
            Add-Content $env:GITHUB_STEP_SUMMARY '### Windows 包启动验收：通过'
          } else {
            Write-Host "::warning::Windows 包启动验收未通过（outcome=$env:SMOKE_OUTCOME），zip 仅供参考"
            Add-Content $env:GITHUB_STEP_SUMMARY "### Windows 包启动验收：未通过（$env:SMOKE_OUTCOME）"
            Add-Content $env:GITHUB_STEP_SUMMARY '> 包已构建并通过 9 个必需文件校验，但端到端启动验收没跑起来；请看上面 `Package smoke test` 的日志。'
          }
          if (Test-Path $report) {
            Add-Content $env:GITHUB_STEP_SUMMARY '```json'
            Add-Content $env:GITHUB_STEP_SUMMARY (Get-Content $report -Raw)
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
          }

  # 单独一个 job：构建 job 保持 contents: read，不因为「偶尔想发个预发布」
  # 就把整条构建链的 token 提权。预发布不会进 /releases/latest，Android
  # 客户端的更新检查不受影响。
  publish:
    needs: windows
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.all_sources && 'zhenguojian' || 'hongguojian' }}-windows-x64
          path: dist/windows

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\).*/\1/p' pubspec.yaml | head -1)"
          test -n "$version" || { echo 'pubspec.yaml 里没读到 version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=windows-$version" >> "$GITHUB_OUTPUT"
          ls -lh dist/windows

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          version='${{ steps.meta.outputs.version }}'
          mapfile -t files < <(find dist/windows -maxdepth 1 -type f \( -name '*.zip' -o -name 'SHA256SUMS.txt' \) -print | sort)
          test "${#files[@]}" -gt 0 || { echo '没找到要发布的 zip'; exit 1; }
          cat > /tmp/windows-notes.md <<EOF
          Windows x64 预览包，版本 $version。

          - 解压后直接运行 \`zhenguojian.exe\`，无需安装、无需 Flutter / Visual Studio。
          - 构建记录：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - 校验：同目录 \`SHA256SUMS.txt\`。
          - 这是**预发布**，不会出现在 \`/releases/latest\`，不影响 Android 端应用内更新。
          - Windows 版没有应用内更新通道，升级请重新下载新包。
          - 启动验收结果见构建 run 的 job summary。
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            echo "已更新预发布 $tag"
          else
            gh release create "$tag" "${files[@]}" \
              --title "真果鉴 TV Windows x64 $version（预览）" \
              --notes-file /tmp/windows-notes.md \
              --prerelease --target "$GITHUB_SHA"
            echo "已创建预发布 $tag"
          fi
