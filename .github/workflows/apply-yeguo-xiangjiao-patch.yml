name: Format Yeguo Xiangjiao Sources

on:
  push:
    branches:
      - feature/yeguo-xiangjiao-sources
    paths:
      - '.github/workflows/apply-yeguo-xiangjiao-patch.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/yeguo-xiangjiao-sources
          fetch-depth: 0

      - name: Fix parser brace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/core/provider_xiangjiao.go')
          text = p.read_text(encoding='utf-8')
          old = '''\t\t\tif text := strings.TrimSpace(nativeText(value)); text != "" {\n\t\t\t\treturn text\n\t\t\t}\n\t}\n\treturn ""\n}'''
          new = '''\t\t\tif text := strings.TrimSpace(nativeText(value)); text != "" {\n\t\t\t\treturn text\n\t\t\t}\n\t\t}\n\t}\n\treturn ""\n}'''
          if text.count(old) != 1:
              raise SystemExit('xiangjiaoText patch target changed')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Go formatter only
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Parse and format modified Go sources
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            native/core/provider_yeguo.go \
            native/core/provider_xiangjiao.go \
            native/core/provider_huangguo.go \
            native/core/provider_media.go \
            native/core/app_runtime.go \
            native/core/app_categories.go
          git diff --check

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/core
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'Fix and format Yeguo and Xiangjiao sources'
          git push origin HEAD:feature/yeguo-xiangjiao-sources
