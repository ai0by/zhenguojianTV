name: Format Yeguo Xiangjiao Sources

on:
  push:
    branches:
      - feature/yeguo-xiangjiao-sources
    paths:
      - '.github/workflows/apply-yeguo-xiangjiao-patch.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/yeguo-xiangjiao-sources
          fetch-depth: 0

      - name: Go formatter only
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Parse and format modified Go sources
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            native/core/provider_yeguo.go \
            native/core/provider_xiangjiao.go \
            native/core/provider_huangguo.go \
            native/core/provider_media.go \
            native/core/app_runtime.go \
            native/core/app_categories.go
          git diff --check

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/core
          git commit -m 'Format Yeguo and Xiangjiao sources'
          git push origin HEAD:feature/yeguo-xiangjiao-sources
