name: Harden Yeguo Entitlements

on:
  push:
    branches:
      - feature/yeguo-xiangjiao-sources
    paths:
      - '.github/workflows/apply-yeguo-xiangjiao-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/yeguo-xiangjiao-sources
          fetch-depth: 0

      - name: Propagate drama entitlement to episodes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/core/provider_yeguo.go')
          text = p.read_text(encoding='utf-8')

          old = '''func yeguoLocked(row map[string]any) bool {\n'''
          new = '''func yeguoHasExplicitAccess(row map[string]any) bool {\n\tfor _, key := range []string{"can_play", "canPlay", "playable", "owned", "is_free", "isFree", "free", "content_access_type", "contentAccessType", "charge_type", "chargeType", "access_type"} {\n\t\tif _, ok := row[key]; ok {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n\nfunc yeguoLocked(row map[string]any) bool {\n'''
          if text.count(old) != 1:
              raise SystemExit('yeguoLocked target changed')
          text = text.replace(old, new, 1)

          old = '''\ttype episodeRow struct {\n\t\tid     string\n\t\tindex  int\n\t\ttitle  string\n\t\tlocked bool\n\t}\n'''
          new = '''\ttype episodeRow struct {\n\t\tid             string\n\t\tindex          int\n\t\ttitle          string\n\t\tlocked         bool\n\t\texplicitAccess bool\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit('episodeRow target changed')
          text = text.replace(old, new, 1)

          old = '''\t\tepisodes = append(episodes, episodeRow{\n\t\t\tid: episodeID, index: index,\n\t\t\ttitle:  yeguoText(row, "title", "episode_title", "episodeTitle", "name"),\n\t\t\tlocked: yeguoLocked(row),\n\t\t})\n'''
          new = '''\t\tepisodes = append(episodes, episodeRow{\n\t\t\tid:             episodeID,\n\t\t\tindex:          index,\n\t\t\ttitle:          yeguoText(row, "title", "episode_title", "episodeTitle", "name"),\n\t\t\tlocked:         yeguoLocked(row),\n\t\t\texplicitAccess: yeguoHasExplicitAccess(row),\n\t\t})\n'''
          if text.count(old) != 1:
              raise SystemExit('episode append target changed')
          text = text.replace(old, new, 1)

          old = '''\tif len(episodes) == 0 {\n\t\treturn Drama{}, nil, fmt.Errorf("野果详情未返回分集，站点结构可能已变化")\n\t}\n\tfor index := range episodes {\n'''
          new = '''\tif len(episodes) == 0 {\n\t\treturn Drama{}, nil, fmt.Errorf("野果详情未返回分集，站点结构可能已变化")\n\t}\n\tmetaLocked := meta != nil && yeguoLocked(meta)\n\tfor index := range episodes {\n\t\t// 当前站点的剧级对象带 content_access_type，但分集对象不一定重复携带。\n\t\t// 若剧级已经明确 coin/vip，而某集没有独立权益字段，按锁定处理；\n\t\t// 只有分集自己明确 can_play/free/owned 时才允许覆盖剧级状态。\n\t\tif metaLocked && !episodes[index].explicitAccess {\n\t\t\tepisodes[index].locked = true\n\t\t}\n'''
          if text.count(old) != 1:
              raise SystemExit('episode normalization target changed')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Go formatter only
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: false

      - name: Parse and format Yeguo provider
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w native/core/provider_yeguo.go
          git diff --check

      - name: Commit entitlement fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/core/provider_yeguo.go
          git commit -m 'Harden Yeguo episode entitlement handling'
          git push origin HEAD:feature/yeguo-xiangjiao-sources
