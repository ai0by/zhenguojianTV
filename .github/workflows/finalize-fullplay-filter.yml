name: Finalize full-play filtering

on:
  push:
    branches:
      - feature/yeguo-xiangjiao-sources
    paths:
      - .github/workflows/finalize-fullplay-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yeguo-xiangjiao-sources
          fetch-depth: 0
      - name: Tighten validation helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Xiangjiao: single-flight guest refresh. Existing session mutex still guards state.
          p = Path('native/core/provider_xiangjiao.go')
          s = p.read_text()
          old = 'var xiangjiaoPlayableCache sync.Map\n'
          new = 'var (\n\txiangjiaoPlayableCache sync.Map\n\txiangjiaoGuestRefreshMu sync.Mutex\n)\n'
          if old not in s:
              raise SystemExit('xiangjiao cache marker not found')
          s = s.replace(old, new, 1)
          sig = 'func (d *Downloader) xiangjiaoGuestToken(ctx context.Context, force bool) (string, error) {\n'
          repl = sig + '\txiangjiaoGuestRefreshMu.Lock()\n\tdefer xiangjiaoGuestRefreshMu.Unlock()\n'
          if sig not in s:
              raise SystemExit('xiangjiao guest token signature not found')
          s = s.replace(sig, repl, 1)
          p.write_text(s)

          # Yeguo: scope episode discovery to the requested drama when possible.
          p = Path('native/core/provider_yeguo.go')
          s = p.read_text()
          start = s.index('func yeguoEpisodeIDs(value any) []string {')
          end = s.index('func yeguoPlaybackMap(value any) map[string]any {', start)
          helper = r'''func yeguoEpisodeIDs(value any, sourceID string) []string {
	sourceID = strings.TrimSpace(sourceID)
	var fallback []any
	var target []any
	var walk func(any)
	walk = func(current any) {
		switch typed := current.(type) {
		case map[string]any:
			if episodes, ok := typed["episodes"].([]any); ok && len(episodes) > 0 {
				if fallback == nil {
					fallback = episodes
				}
				id := yeguoText(typed, "video_id", "videoId", "playlet_id", "playletId", "drama_id", "dramaId", "id")
				if sourceID != "" && id == sourceID {
					target = episodes
					return
				}
			}
			for _, child := range typed {
				if target == nil {
					walk(child)
				}
			}
		case []any:
			for _, child := range typed {
				if target == nil {
					walk(child)
				}
			}
		}
	}
	walk(value)
	rows := target
	if rows == nil {
		rows = fallback
	}
	seen := map[string]bool{}
	ids := make([]string, 0, len(rows))
	for _, item := range rows {
		row, ok := item.(map[string]any)
		if !ok {
			continue
		}
		if adv, exists := yeguoBool(row, "is_adv", "isAdv"); exists && adv {
			continue
		}
		id := yeguoText(row, "id", "episode_id", "episodeId")
		if id != "" && !seen[id] {
			seen[id] = true
			ids = append(ids, id)
		}
	}
	return ids
}

'''
          s = s[:start] + helper + s[end:]
          s = s.replace('episodeIDs := yeguoEpisodeIDs(detail)', 'episodeIDs := yeguoEpisodeIDs(detail, sourceID)', 1)
          p.write_text(s)
          PY
          gofmt -w native/core/provider_xiangjiao.go native/core/provider_yeguo.go
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/core/provider_xiangjiao.go native/core/provider_yeguo.go
          git commit -m 'fix: tighten full-play source validation'
          git push origin HEAD:feature/yeguo-xiangjiao-sources
