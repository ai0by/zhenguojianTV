name: Apply full-session probe patch

on:
  push:
    branches:
      - feature/yeguo-xiangjiao-sources
    paths:
      - .github/workflows/apply-full-session-probe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yeguo-xiangjiao-sources
          fetch-depth: 0

      - name: Apply minimal playback probing changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Banana: keep commerce/VIP metadata for UI, but always keep an episode marker.
          # The existing UI already asks the user before trying VIP playback; only after
          # that explicit action do we let the server decide whether guest full playback
          # is actually available.
          replace_once(
              "native/core/provider_xiangjiao.go",
              '''\t\tif !episode.locked {\n\t\t\tchapter.VideoURL = xiangjiaoEpisodeMarker(episode.id)\n\t\t\tfreeFound = true\n\t\t}\n''',
              '''\t\tchapter.VideoURL = xiangjiaoEpisodeMarker(episode.id)\n\t\tif !episode.locked {\n\t\t\tfreeFound = true\n\t\t}\n''',
          )
          replace_once(
              "native/core/provider_xiangjiao.go",
              '''func (d *Downloader) resolveXiangjiaoPlayback(ctx context.Context, task Task) (providerMedia, error) {\n\tif task.Chapter.VIP {\n\t\treturn providerMedia{}, fmt.Errorf("香蕉该集需要会员或购买，游客身份不能播放正片")\n\t}\n\tepisodeID := xiangjiaoMarkerEpisode(task.Chapter.VideoURL)\n''',
              '''func (d *Downloader) resolveXiangjiaoPlayback(ctx context.Context, task Task) (providerMedia, error) {\n\tepisodeID := xiangjiaoMarkerEpisode(task.Chapter.VideoURL)\n''',
          )
          replace_once(
              "native/core/provider_xiangjiao.go",
              '''\tif episodeID == "" {\n\t\treturn providerMedia{}, fmt.Errorf("香蕉分集播放标识无效，请刷新详情")\n\t}\n\tfor attempt := 0; attempt < 2; attempt++ {\n''',
              '''\tif episodeID == "" {\n\t\treturn providerMedia{}, fmt.Errorf("香蕉分集播放标识无效，请刷新详情")\n\t}\n\t_, dramaID, validDrama := splitProviderDramaID(task.DramaID)\n\tif !validDrama {\n\t\tdramaID = ""\n\t}\n\tfor attempt := 0; attempt < 2; attempt++ {\n''',
          )
          replace_once(
              "native/core/provider_xiangjiao.go",
              '''\t\tdecoded, err := d.xiangjiaoJSON(ctx, http.MethodPost, "/api/playback/sessions", map[string]any{"episode_id": episodeID}, token)\n''',
              '''\t\tpayload := map[string]any{"episode_id": episodeID}\n\t\tif dramaID != "" {\n\t\t\tpayload["drama_id"] = dramaID\n\t\t}\n\t\tdecoded, err := d.xiangjiaoJSON(ctx, http.MethodPost, "/api/playback/sessions", payload, token)\n''',
          )

          # Yeguo: same policy. Metadata remains visible as VIP, but if the user chooses
          # “try playback”, call the normal play endpoint and let its server-side result
          # be authoritative. Also use the playlet_id parameter found in public clients.
          replace_once(
              "native/core/provider_yeguo.go",
              '''\t\tif !episode.locked {\n\t\t\tchapter.VideoURL = yeguoEpisodeMarker(episode.id)\n\t\t\tfreeFound = true\n\t\t}\n''',
              '''\t\tchapter.VideoURL = yeguoEpisodeMarker(episode.id)\n\t\tif !episode.locked {\n\t\t\tfreeFound = true\n\t\t}\n''',
          )
          replace_once(
              "native/core/provider_yeguo.go",
              '''func (d *Downloader) resolveYeguoPlayback(ctx context.Context, task Task) (providerMedia, error) {\n\tif task.Chapter.VIP {\n\t\treturn providerMedia{}, fmt.Errorf("野果该集标记为会员/金币内容，需要站点授权后才能播放正片")\n\t}\n\tepisodeID := yeguoMarkerEpisode(task.Chapter.VideoURL)\n''',
              '''func (d *Downloader) resolveYeguoPlayback(ctx context.Context, task Task) (providerMedia, error) {\n\tepisodeID := yeguoMarkerEpisode(task.Chapter.VideoURL)\n''',
          )
          replace_once(
              "native/core/provider_yeguo.go",
              '''\tattempts := []map[string]string{\n\t\t{"episode_id": episodeID, "video_id": dramaID},\n''',
              '''\tattempts := []map[string]string{\n\t\t{"playlet_id": dramaID, "episode_id": episodeID, "video_id": dramaID},\n\t\t{"episode_id": episodeID, "video_id": dramaID},\n''',
          )
          PY

      - name: Format and validate patch
        shell: bash
        run: |
          gofmt -w native/core/provider_yeguo.go native/core/provider_xiangjiao.go
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/core/provider_yeguo.go native/core/provider_xiangjiao.go
          git commit -m "feat: probe server-authorized full playback"
          git push origin HEAD:feature/yeguo-xiangjiao-sources
