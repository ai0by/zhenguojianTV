name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
version: 0.8.29+111

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  pinyin: ^3.3.0
  shared_preferences: ^2.5.5
  # 2.6.8 修了 Windows 上「未设 log callback 且无 stdout 句柄时抛未捕获
  # FileSystemException」——从资源管理器双击启动必踩；2.6.4 起默认也不再
  # 需要 MSVC editbin 去改 FFmpeg DLL 的 ASLR。依赖与 2.6.2 完全一致。
  ffmpeg_kit_flutter_new_min_gpl: 2.6.8
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  nsd: 5.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  # 0.8.10：开屏图。手机竖版 1080x1920、电视横版 1920x1080，
  # 由 lib/app_splash.dart 按当前布局二选一。
  # 0.8.27：品牌图回滚成位图，关于对话框直接用成品 logo.jpg。
  assets:
    - assets/splash/
    - assets/logo.jpg
